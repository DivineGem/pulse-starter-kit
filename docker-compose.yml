# Pulse starter kit: Pulse, 4 mock services, and a webhook receiver.
# Start:  docker compose up --build
services:
  quotes:
    build: ./mock-service
    environment: { SERVICE_NAME: quotes, PORT: "8080" }
    ports: ["7001:8080"]
  payments:
    build: ./mock-service
    environment: { SERVICE_NAME: payments, PORT: "8080" }
    ports: ["7002:8080"]
  claims:
    build: ./mock-service
    environment: { SERVICE_NAME: claims, PORT: "8080" }
    ports: ["7003:8080"]
  notifications:
    build: ./mock-service
    environment: { SERVICE_NAME: notifications, PORT: "8080" }
    ports: ["7004:8080"]
  webhook-receiver:
    build: ./webhook-receiver
    environment: { PORT: "9000" }
    ports: ["${WEBHOOK_PORT:-9900}:9000"]  # host port: 9900 by default, override with WEBHOOK_PORT
  pulse:
    build: ./pulse
    environment:
      PULSE_DB: /data/pulse.sqlite3
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-pulse-local-change-me}
      OPERATOR_USERS: ${OPERATOR_USERS:-}
      WEBHOOK_URL: http://webhook-receiver:9000/pulse
    ports: ["127.0.0.1:${PULSE_PORT:-8000}:8000"]
    volumes:
      - pulse-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - quotes
      - payments
      - claims
      - notifications
      - webhook-receiver
    restart: unless-stopped

volumes:
  pulse-data:
