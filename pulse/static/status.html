<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service status</title>
  <link rel="stylesheet" href="/static/pulse.css">
  <script src="/static/status.js" defer></script>
</head>
<body class="public-page">
  <!-- This page intentionally has no operator diagnostics, incident notes, or login. -->
  <header class="topbar"><div><div class="eyebrow">SERVICE UPDATES</div><h1>System status</h1></div><span class="public-badge">Public</span></header>
  <main>
    <section class="panel public-summary"><div class="section-heading"><div><div class="eyebrow">CURRENT STATUS</div><h2 id="overall">Checking services…</h2></div><span id="updated-at" class="muted"></span></div></section>
    <section class="panel"><div class="section-heading"><div><div class="eyebrow">PRODUCTS</div><h2>Service availability</h2></div></div><div id="services" class="public-services"></div></section>
    <p class="footnote">Status is updated automatically as checks complete. Times are shown in your local timezone.</p>
  </main>
</body>
</html>
