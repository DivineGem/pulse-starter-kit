<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse · Operator login</title>
  <link rel="stylesheet" href="/static/pulse.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="eyebrow">SERVICE RELIABILITY</div>
    <h1>Operator sign in</h1>
    <p class="muted">Sign in to view service diagnostics and manage incidents.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit">Sign in</button>
    </form>
    <a class="login-public-link" href="/status">View public status page</a>
  </main>
</body>
</html>
